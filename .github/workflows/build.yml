name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm install
      - run: npx cap add android
      - name: Patch Android (icon aliases + switcher plugin)
        run: python3 tools/patch_android.py android
      - name: Generate icons
        run: python3 tools/icons.py android/app/src/main/res
      - name: Set versionCode from run number
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gemma-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
