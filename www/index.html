<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جِمّا</title>
<style>
  @font-face {
    font-family: "Lalezar";
    src: url("Lalezar-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Cairo";
    src: url("Cairo.ttf") format("truetype");
    font-weight: 200 1000;
  }
  html, body { height: 100%; margin: 0; background: #000000; color: #F2F6F9; font-family: "Cairo", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  h1 { font-family: "Lalezar", sans-serif; font-weight: 400; color: #38BDF8; font-size: 72px; margin: 0; }
  p { margin: 0; opacity: .85; font-size: 18px; }
  .nums { font-family: "Lalezar", sans-serif; font-size: 44px; color: #F2F6F9; direction: ltr; }
  .nums-cairo { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 44px; color: #F2F6F9; direction: ltr; }
  .label { font-size: 13px; opacity: .6; }
</style>
</head>
<body>
  <h1>جِمّا</h1>
  <p>المرحلة 0 · النسخة 3</p>
  <div class="label">أرقام Lalezar</div>
  <div class="nums">10 × 62.5 kg</div>
  <div class="label">أرقام Cairo ثقيل</div>
  <div class="nums-cairo">10 × 62.5 kg</div>
</body>
</html>
